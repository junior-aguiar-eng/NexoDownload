name: CI - Nexo Download Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Test (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Compilar Módulos C Nativos (.pyd via Cython)
        run: |
          python compile_pyd.py

      - name: Executar Bateria de Testes Automatizados (pytest)
        run: |
          python -m pytest tests/ -v --basetemp=.pytest_temp
